name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Swift tests
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Run tests
        run: swift test --disable-sandbox
      - name: Compile CLI product
        run: swift build --disable-sandbox --product panelctl
      - name: Compile app product
        run: swift build --disable-sandbox --product PanelCtlApp

  release:
    name: Test and publish universal macOS release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Run tests
        run: swift test --disable-sandbox
      - name: Package release
        run: ./scripts/package-release.sh "$GITHUB_REF_NAME"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/panelctl-${GITHUB_REF_NAME}-macos-universal.zip" \
            "dist/panelctl-${GITHUB_REF_NAME}-macos-universal.zip.sha256" \
            "dist/panelctl-app-${GITHUB_REF_NAME}-macos-universal.zip" \
            "dist/panelctl-app-${GITHUB_REF_NAME}-macos-universal.zip.sha256" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --notes "Universal CLI and PanelCtl.app archives are ad-hoc signed, not Developer ID signed or notarized. Verify SHA-256 checksums; macOS may require Privacy & Security > Open Anyway." \
            --generate-notes
