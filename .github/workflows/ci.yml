name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

# Explicit bash enables pipefail, preserving test failures through tee.
defaults:
  run:
    shell: bash

# CI runners are dedicated to testing; local runs remain noninteractive by default.
env:
  PANELCTL_TEST_INTERACTIVE_UI: "1"

jobs:
  signing-check:
    name: Check configured release signing identity
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Check signing identity import
        env:
          PANELCTL_SIGNING_P12_BASE64: ${{ secrets.PANELCTL_SIGNING_P12_BASE64 }}
          PANELCTL_SIGNING_P12_PASSWORD: ${{ secrets.PANELCTL_SIGNING_P12_PASSWORD }}
          PANELCTL_SIGNING_IDENTITY: ${{ secrets.PANELCTL_SIGNING_IDENTITY }}
        run: |
          export PANELCTL_SIGNING_KEYCHAIN="$RUNNER_TEMP/panelctl-signing.keychain-db"
          echo "PANELCTL_SIGNING_KEYCHAIN=$PANELCTL_SIGNING_KEYCHAIN" >> "$GITHUB_ENV"
          python3 scripts/import-signing.py
          cp /usr/bin/true "$RUNNER_TEMP/panelctl-signing-probe"
          source scripts/signing.sh
          panelctl_signing_configure
          panelctl_sign "$RUNNER_TEMP/panelctl-signing-probe" com.brettinternet.panelctl.signing-probe
          codesign --verify --strict "$RUNNER_TEMP/panelctl-signing-probe"
      - name: Remove signing keychain
        if: always()
        run: |
          if [[ -f "$PANELCTL_SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$PANELCTL_SIGNING_KEYCHAIN"
          fi

  test:
    name: Swift tests
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Lint compiler warnings
        run: swift build --disable-sandbox --build-tests -Xswiftc -warnings-as-errors
      - name: Run tests
        timeout-minutes: 5
        run: python3 scripts/test-ci.py 2>&1 | tee test-output.log
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            test-output.log
            test-stack-*.log
      - name: Check release version policy
        run: ./scripts/test-release-version.sh
      - name: Check signing policy (fake tools, no keys)
        run: python3 scripts/test-signing.py
      - name: Compile CLI product
        run: swift build --disable-sandbox --product panelctl
      - name: Compile app product
        run: swift build --disable-sandbox --product PanelCtlApp

  release:
    name: Test and publish universal macOS release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    env:
      PANELCTL_REQUIRE_SIGNING: "1"
      PANELCTL_SIGNING_IDENTITY: ${{ secrets.PANELCTL_SIGNING_IDENTITY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Run tests
        timeout-minutes: 5
        run: python3 scripts/test-ci.py 2>&1 | tee test-output.log
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            test-output.log
            test-stack-*.log
      - name: Check signing policy (fake tools, no keys)
        run: python3 scripts/test-signing.py
      - name: Import release signing identity
        env:
          PANELCTL_SIGNING_P12_BASE64: ${{ secrets.PANELCTL_SIGNING_P12_BASE64 }}
          PANELCTL_SIGNING_P12_PASSWORD: ${{ secrets.PANELCTL_SIGNING_P12_PASSWORD }}
        run: |
          export PANELCTL_SIGNING_KEYCHAIN="$RUNNER_TEMP/panelctl-signing.keychain-db"
          echo "PANELCTL_SIGNING_KEYCHAIN=$PANELCTL_SIGNING_KEYCHAIN" >> "$GITHUB_ENV"
          python3 scripts/import-signing.py
      - name: Package release
        run: ./scripts/package-release.sh "$GITHUB_REF_NAME"
      - name: Remove release signing keychain
        if: always()
        run: |
          if [[ -f "$PANELCTL_SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$PANELCTL_SIGNING_KEYCHAIN"
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            Downloads:
            - **PanelCtl menu-bar app** — `PanelCtl-…-macos-universal.zip`
            - **Standalone panelctl CLI** — `panelctl-cli-…-macos-universal.zip`

            Both archives are universal arm64/x86_64 and signed with a stable self-signed certificate, not Developer ID signed or notarized. Verify the matching SHA-256 checksum; macOS may require Privacy & Security → Open Anyway.
        run: |
          source scripts/release-version.sh
          release_version_parse "$GITHUB_REF_NAME"
          release_flags=()
          if [[ "$RELEASE_IS_PRERELEASE" == 1 ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          release_assets=(
            "dist/PanelCtl-${GITHUB_REF_NAME}-macos-universal.zip#PanelCtl menu-bar app (universal macOS)"
            "dist/PanelCtl-${GITHUB_REF_NAME}-macos-universal.zip.sha256#PanelCtl app SHA-256"
            "dist/panelctl-cli-${GITHUB_REF_NAME}-macos-universal.zip#Standalone panelctl CLI (universal macOS)"
            "dist/panelctl-cli-${GITHUB_REF_NAME}-macos-universal.zip.sha256#panelctl CLI SHA-256"
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${release_assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "${release_assets[@]}" \
              --title "$GITHUB_REF_NAME" \
              --verify-tag \
              "${release_flags[@]}" \
              --notes "$RELEASE_NOTES" \
              --generate-notes
          fi
