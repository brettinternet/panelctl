name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Swift tests
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Lint compiler warnings
        run: swift build --disable-sandbox --build-tests -Xswiftc -warnings-as-errors
      - name: Run tests
        run: swift test --disable-sandbox
      - name: Check release version policy
        run: ./scripts/test-release-version.sh
      - name: Compile CLI product
        run: swift build --disable-sandbox --product panelctl
      - name: Compile app product
        run: swift build --disable-sandbox --product PanelCtlApp

  release:
    name: Test and publish universal macOS release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Run tests
        run: swift test --disable-sandbox
      - name: Package release
        run: ./scripts/package-release.sh "$GITHUB_REF_NAME"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            Downloads:
            - **PanelCtl menu-bar app** — `PanelCtl-…-macos-universal.zip`
            - **Standalone panelctl CLI** — `panelctl-cli-…-macos-universal.zip`

            Both archives are universal arm64/x86_64 and ad-hoc signed, not Developer ID signed or notarized. Verify the matching SHA-256 checksum; macOS may require Privacy & Security → Open Anyway.
        run: |
          source scripts/release-version.sh
          release_version_parse "$GITHUB_REF_NAME"
          release_flags=()
          if [[ "$RELEASE_IS_PRERELEASE" == 1 ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/PanelCtl-${GITHUB_REF_NAME}-macos-universal.zip#PanelCtl menu-bar app (universal macOS)" \
            "dist/PanelCtl-${GITHUB_REF_NAME}-macos-universal.zip.sha256#PanelCtl app SHA-256" \
            "dist/panelctl-cli-${GITHUB_REF_NAME}-macos-universal.zip#Standalone panelctl CLI (universal macOS)" \
            "dist/panelctl-cli-${GITHUB_REF_NAME}-macos-universal.zip.sha256#panelctl CLI SHA-256" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            "${release_flags[@]}" \
            --notes "$RELEASE_NOTES" \
            --generate-notes
