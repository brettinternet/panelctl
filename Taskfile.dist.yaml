---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  ARM64_BUILD_DIR: .build/task-release-arm64
  X86_64_BUILD_DIR: .build/task-release-x86_64
  APP_PATH: .build/PanelCtl.app
  # Named for the link so the app records the SDK it uses; see scripts/package-release.sh.
  SDK_PATH:
    sh: xcrun --show-sdk-path

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task -l

  build:release:
    desc: Build the app (Release)
    cmds:
      - swift build --disable-sandbox --configuration release --product PanelCtlApp --triple arm64-apple-macosx13.0 --scratch-path "{{.ARM64_BUILD_DIR}}" -Xswiftc -Xclang-linker -Xswiftc -isysroot -Xswiftc -Xclang-linker -Xswiftc "{{.SDK_PATH}}"
      - swift build --disable-sandbox --configuration release --product panelctl --triple arm64-apple-macosx13.0 --scratch-path "{{.ARM64_BUILD_DIR}}" -Xswiftc -Xclang-linker -Xswiftc -isysroot -Xswiftc -Xclang-linker -Xswiftc "{{.SDK_PATH}}"
      - swift build --disable-sandbox --configuration release --product PanelCtlApp --triple x86_64-apple-macosx13.0 --scratch-path "{{.X86_64_BUILD_DIR}}" -Xswiftc -Xclang-linker -Xswiftc -isysroot -Xswiftc -Xclang-linker -Xswiftc "{{.SDK_PATH}}"
      - swift build --disable-sandbox --configuration release --product panelctl --triple x86_64-apple-macosx13.0 --scratch-path "{{.X86_64_BUILD_DIR}}" -Xswiftc -Xclang-linker -Xswiftc -isysroot -Xswiftc -Xclang-linker -Xswiftc "{{.SDK_PATH}}"
      - /bin/test ! -e "{{.APP_PATH}}" || /usr/bin/trash "{{.APP_PATH}}"
      - |
        version=$(/usr/bin/sed -n 's/.*public static let version = "panelctl \([^"]*\)".*/\1/p' Sources/PanelCtlCore/CLIHelp.swift)
        arm64_bin=$(swift build --disable-sandbox --configuration release --triple arm64-apple-macosx13.0 --scratch-path "{{.ARM64_BUILD_DIR}}" --show-bin-path)
        x86_64_bin=$(swift build --disable-sandbox --configuration release --triple x86_64-apple-macosx13.0 --scratch-path "{{.X86_64_BUILD_DIR}}" --show-bin-path)
        ./scripts/package-app.sh "v$version" \
          "$arm64_bin/PanelCtlApp" \
          "$x86_64_bin/PanelCtlApp" \
          "$arm64_bin/panelctl" \
          "$x86_64_bin/panelctl" \
          "{{.APP_PATH}}"

  copy:release:
    desc: Copy the built app release to the Applications folder
    deps: ["build:release"]
    cmds:
      # An ad-hoc signature changes every build, so macOS would drop privacy grants such as Accessibility.
      - |
        if ! codesign -d -r- "{{.APP_PATH}}" 2>&1 | grep -q 'certificate leaf = H"'; then
          echo 'copy:release: refusing an ad-hoc signed app; set PANELCTL_SIGNING_IDENTITY (see docs/development.md)' >&2
          exit 1
        fi
      - /usr/bin/xcrun swift ./scripts/install-release.swift "{{.APP_PATH}}" /Applications/PanelCtl.app

  open:release:
    desc: Run the built app (Release)
    cmds:
      - open "{{.APP_PATH}}"
